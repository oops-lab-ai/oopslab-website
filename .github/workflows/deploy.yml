name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The demo gallery's source stays in the private repository; only the built pages are published.
      - name: Checkout the gallery
        uses: actions/checkout@v4
        with:
          repository: oops-lab-ai/oopslab
          ref: main
          path: _private
          ssh-key: ${{ secrets.OOPSLAB_GALLERY_DEPLOY_KEY }}
          persist-credentials: false
          sparse-checkout: website/src/gallery

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare website files
        run: |
          mkdir -p _site/assets
          cp index.html website-privacy.html website-terms.html privacy.html terms.html 404.html CNAME robots.txt sitemap.xml _site/
          cp studio.css website-legal.css styles.css studio.js contact.js contact-config.js _site/
          rsync -a --exclude='*.json' --exclude='og.svg' assets/ _site/assets/

      - name: Add the unlisted gallery
        run: |
          cp -r _private/website/src/gallery _site/gallery
          grep -q 'noindex,nofollow,noimageindex' _site/gallery/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
