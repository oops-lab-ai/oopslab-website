name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare website files
        run: |
          mkdir -p _site/assets
          cp index.html website-privacy.html website-terms.html privacy.html terms.html 404.html CNAME robots.txt sitemap.xml _site/
          cp studio.css website-legal.css styles.css studio.js contact.js contact-config.js _site/
          rsync -a --exclude='*.json' --exclude='og.svg' assets/ _site/assets/

      # The gallery's source stays in the private oopslab repository. Copy its built, already public files.
      - name: Add the unlisted gallery
        run: |
          origin=https://oopslab.pages.dev/gallery
          mkdir -p _site/gallery/assets
          curl --fail --silent --show-error --retry 3 -o _site/gallery/index.html "$origin/"
          curl --fail --silent --show-error --retry 3 -o _site/gallery/app.js "$origin/app.js"
          grep -q 'noindex,nofollow,noimageindex' _site/gallery/index.html
          grep -oE "\./assets/[^\"'\`\\)]+" _site/gallery/app.js | sed 's#^\./##' | sort -u > gallery-files.txt
          test "$(wc -l < gallery-files.txt)" -gt 100
          xargs -P 8 -I {} curl --fail --silent --show-error --retry 3 -o "_site/gallery/{}" "$origin/{}" < gallery-files.txt
          test "$(ls _site/gallery/assets | wc -l)" -eq "$(wc -l < gallery-files.txt)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
