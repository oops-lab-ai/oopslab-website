<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 · Oops Lab</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..900,0..100,0..1&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .nf {
      max-width: 720px;
      margin: 0 auto;
      padding: 120px 32px 96px;
      text-align: left;
    }
    .nf__code {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ember);
      margin: 0 0 16px;
    }
    .nf__title {
      font-family: var(--serif);
      font-weight: 360;
      font-size: clamp(48px, 7vw, 84px);
      line-height: 1.04;
      letter-spacing: -0.022em;
      margin: 0 0 24px;
      color: var(--ink);
      font-variation-settings: "opsz" 144, "SOFT" 60, "WONK" 1;
    }
    .nf__title em { font-style: italic; color: var(--ember-deep); }
    .nf p { color: var(--ink-soft); line-height: 1.6; max-width: 50ch; }
    .nf .btn { margin-top: 24px; }
  </style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<header class="topbar">
  <div class="topbar__inner">
    <a class="brand" href="/" aria-label="Oops Lab home">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="22" height="22" stroke="currentColor" fill="none" stroke-width="1.6">
          <rect x="3" y="3" width="26" height="26" rx="1.2"/>
          <path d="M3 11h26 M3 21h26 M11 3v26 M21 3v26"/>
          <circle cx="16" cy="16" r="3.6" fill="currentColor" stroke="none"/>
        </svg>
      </span>
      <span class="brand__name">Oops&nbsp;Lab</span>
    </a>
  </div>
</header>
<main class="nf">
  <p class="nf__code">404 &middot; not found</p>
  <h1 class="nf__title">Wrong <em>page</em>. <br>Right <em>company</em>.</h1>
  <p>This URL doesn&rsquo;t exist on oopslab.ai. Either we moved it, or you&rsquo;re testing our error handling. Either way, head home.</p>
  <a class="btn btn--ghost" href="/">&larr; Back to oopslab.ai</a>
</main>
</body>
</html>
